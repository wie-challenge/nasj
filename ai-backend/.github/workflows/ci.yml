name: AI backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src tests scripts
      - run: uv run --frozen pytest
      - run: uv run --frozen python scripts/check_content.py
      - run: uv build
      - name: Verify installed wheel imports independently of the source tree
        run: |
          uv venv /tmp/nasj-ai-wheel-check --python '${{ matrix.python }}'
          uv pip install --python /tmp/nasj-ai-wheel-check/bin/python dist/*.whl
          cd /tmp
          /tmp/nasj-ai-wheel-check/bin/python -I -c 'from nasj_ai.main import create_app; assert callable(create_app)'
