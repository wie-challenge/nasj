[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nasj-ai"
version = "0.1.0"
description = "Private backend for the Nasouj assistant of NASJ"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aio-pika>=10.2,<11",
  "fastapi>=0.115,<1",
  "openai>=3.41,<4",
  "pydantic-settings>=2.8,<3",
  "pyyaml>=6.0.3,<7",
  "redis>=8.1,<9",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "httpx2>=2.13.1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nasj_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
