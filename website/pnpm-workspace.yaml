packages:
  - apps/*
  - packages/*
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.10'
  - '@better-auth/drizzle-adapter@1.7.10'
  - '@better-auth/kysely-adapter@1.7.10'
  - '@better-auth/memory-adapter@1.7.10'
  - '@better-auth/mongo-adapter@1.7.10'
  - '@better-auth/prisma-adapter@1.7.10'
  - '@better-auth/telemetry@1.7.10'
  - better-auth@1.7.10
  - lucide-react@1.60.0

# Prisma CLI-only transitives pinned past published advisories; runtime remains PostgreSQL.
overrides:
  deepmerge-ts: 8.0.0
  mysql2: 3.23.1
  'smtp-server>nodemailer': 10.0.12
  # Express/NestJS transitives pinned past GHSA-27r3-jxmh-p828 (body-parser) and the multer DoS
  # advisory. Remove once @nestjs/platform-express ships with multer >= 2.5.0.
  body-parser: 2.4.0
  multer: 2.5.0
