# Weekly checks on main that don't depend on a push: the full git history and new advisories.
name: Scheduled security
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
permissions: {}
jobs:
  # Secrets anywhere in the history, including commits made before the hooks existed.
  # Blocking: the baseline (2026-10-24) was clean. Exempt only rotated or false-positive findings.
  secrets-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ENFORCE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/ci/install-gitleaks.sh
      - name: Scan the full history
        id: scan
        run: |
          set +e
          mkdir -p reports
          gitleaks git . --log-opts="--full-history HEAD" --redact --no-banner --verbose --exit-code 99 \
            --report-format json --report-path reports/gitleaks.json
          echo "code=$?" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitleaks-history-report
          path: reports/
          retention-days: 30
      - name: Gate
        if: always()
        env:
          CODE: ${{ steps.scan.outputs.code }}
        run: bash scripts/ci/gate.sh gitleaks-history "$CODE" 99 "$ENFORCE"

  # New advisories for dependencies on main, even in weeks without any push.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: pnpm audit --audit-level=high
