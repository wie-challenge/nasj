rules:
  - id: nasj-next-public-secret
    languages: [typescript]
    severity: ERROR
    message: >-
      $NAME is a NEXT_PUBLIC_ variable: Next.js copies its value into the browser bundle, where
      anyone can read it. Secrets must stay in server-only variables (no NEXT_PUBLIC_ prefix).
    metadata:
      category: security
      cwe: 'CWE-200: Exposure of Sensitive Information'
    patterns:
      - pattern: process.env.$NAME
      - metavariable-regex:
          metavariable: $NAME
          regex: ^NEXT_PUBLIC_.*(SECRET|TOKEN|PASSWORD|PRIVATE|DATABASE|API_KEY|CREDENTIAL)
