services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: nasj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local}
      POSTGRES_DB: nasj
    ports:
      - '127.0.0.1:5442:5432'
    volumes:
      - foundation-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nasj -d nasj']
      interval: 2s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:1026:1025'
      - '127.0.0.1:8026:8025'
volumes:
  foundation-postgres:
